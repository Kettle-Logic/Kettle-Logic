		A00000000000000150000000 /* Build Engine */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			name = "Build Engine";
			shellPath = /bin/sh;
			shellScript = (
				"# Builds the C++ engine as a shared library with CMake. The app loads it at launch; see the Embed Engine phase.",
				"set -e",
				"export PATH=\"/opt/homebrew/bin:/usr/local/bin:$PATH\"",
				"root=\"$SRCROOT/../..\"",
				"cmake -S \"$root/core\" -B \"$root/build/core\" > /dev/null",
				"cmake --build \"$root/build/core\" --target kettlelogic_engine > /dev/null",
				"",
			);
		};
		A00000000000000160000000 /* Embed Engine */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			name = "Embed Engine";
			shellPath = /bin/sh;
			shellScript = (
				"# Puts the engine where the app loads it at launch, and gives the app its update settings. Xcode generates the",
				"# Info.plist, so the update keys are added here. The engine is signed with the app's identity; Xcode then seals the app.",
				"set -e",
				"app=\"$CODESIGNING_FOLDER_PATH\"",
				"engine=\"$app/Contents/Frameworks/libkettlelogic_engine.dylib\"",
				"mkdir -p \"$app/Contents/Frameworks\"",
				"cp \"$SRCROOT/../../build/core/libkettlelogic_engine.dylib\" \"$engine\"",
				"plist=\"$app/Contents/Info.plist\"",
				"set_key() {",
				"    /usr/libexec/PlistBuddy -c \"Delete :$1\" \"$plist\" 2>/dev/null || true",
				"    /usr/libexec/PlistBuddy -c \"Add :$1 string $2\" \"$plist\"",
				"}",
				"set_key KLEngineVersion \"$KL_ENGINE_VERSION\"",
				"set_key KLUpdateManifestURL \"$KL_UPDATE_MANIFEST_URL\"",
				"# Anonymous usage reports go to Google Analytics only in a build given its ids (see docs/privacy.md).",
				"if [ -n \"$KL_GA_MEASUREMENT_ID\" ] && [ -n \"$KL_GA_API_SECRET\" ]; then",
				"    set_key KLGAMeasurementID \"$KL_GA_MEASUREMENT_ID\"",
				"    set_key KLGAAPISecret \"$KL_GA_API_SECRET\"",
				"    if [ \"$KL_GA_DEBUG\" = YES ]; then set_key KLGADebug YES; fi",
				"fi",
				"if [ -n \"$EXPANDED_CODE_SIGN_IDENTITY\" ]; then",
				"    timestamp=\"\"",
				"    if [ \"$CONFIGURATION\" = Release ]; then timestamp=\"--timestamp\"; fi",
				"    codesign --force --options runtime $timestamp --sign \"$EXPANDED_CODE_SIGN_IDENTITY\" \"$engine\"",
				"fi",
				"",
			);
		};
/* End PBXShellScriptBuildPhase section */

